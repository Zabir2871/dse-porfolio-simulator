<style>

<body><svg width="0" height="0" style="position:absolute"><filter id="lg" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="3" result="n"/><feGaussianBlur in="n" stdDeviation="2" result="b"/><feDisplacementMap in="SourceGraphic" in2="b" scale="26" xChannelSelector="R" yChannelSelector="G"/></filter></svg><div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useMemo,useRef}=React;
const FEE=0.0035, KEY='dse-sim-v1';
const SEED=[
['GP','Grameenphone Ltd.','A','Telecommunication',285.5],['SQURPHARMA','Square Pharmaceuticals','A','Pharmaceuticals',216.4],
['BATBC','British American Tobacco BD','A','Food & Allied',330.2],['BXPHARMA','Beximco Pharmaceuticals','A','Pharmaceuticals',96.8],
['RENATA','Renata Ltd.','A','Pharmaceuticals',561.3],['BRACBANK','BRAC Bank Ltd.','A','Bank',38.4],
['ISLAMIBANK','Islami Bank Bangladesh','A','Bank',32.1],['BEXIMCO','Beximco Ltd.','A','Miscellaneous',78.6],
['ROBI','Robi Axiata Ltd.','A','Telecommunication',26.7],['LHBL','LafargeHolcim Bangladesh','A','Cement',62.9],
['WALTONHIL','Walton Hi-Tech Industries','A','Engineering',541.0],['BERGERPBL','Berger Paints Bangladesh','A','Paints',1652.4],
['MARICOBD','Marico Bangladesh','A','Food & Allied',2310.0],['OLYMPIC','Olympic Industries','A','Food & Allied',135.7],
['ICB','Investment Corp. of Bangladesh','A','Financial Institution',105.2],['CITYBANK','The City Bank Ltd.','A','Bank',21.3],
['POWERGRID','Power Grid Co. of BD','A','Fuel & Power',52.6],['BSRMLTD','BSRM Ltd.','A','Engineering',60.4],
['SUMITPOWER','Summit Power Ltd.','B','Fuel & Power',40.8],['UNIQUEHRL','Unique Hotel & Resorts','B','Travel & Leisure',45.2],
['DUTCHBANGL','Dutch-Bangla Bank','Z','Bank',55.0]];
const fmt=(n,d=2)=>Number(n).toLocaleString(CFG.nf||'en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const tk=n=>(CFG.cur||'Tk')+' '+fmt(n);
const r1=n=>Math.round(n*10)/10, r2=n=>Math.round(n*100)/100;
const sg=n=>(n>0?'+':'')+fmt(n);
const cls=n=>n>0.0001?'text-emerald-400':n<-0.0001?'text-rose-400':'text-slate-400';
const need=c=>c==='Z'?3:2;
const limits=m=>({up:r1(m.close*1.1),lo:r1(m.close*0.9)});
let DATES={},LIVE_OK=false,CFG={};
const authH=()=>{try{const t=localStorage.getItem('dse-token');return t?{'X-Token':t}:{}}catch(e){return {}}};
const lab=iso=>{const [y,m,d]=iso.split('-').map(Number);return new Date(Date.UTC(y,m-1,d)).toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short',year:'numeric',timeZone:'UTC'});};
function dateOf(day){if(DATES[day])return DATES[day];const d=new Date(Date.UTC(2026,10,1));let n=day;while(n>0){d.setUTCDate(d.getUTCDate()+1);const w=d.getUTCDay();if(w!==5&&w!==6)n--;}
 return d.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short',year:'numeric',timeZone:'UTC'});}
const gauss=()=>(Math.random()+Math.random()+Math.random()-1.5)*2;
function tick(m){return m.map(s=>{const close=s.ltp;const r=Math.max(-.095,Math.min(.095,gauss()*.018));const ltp=r1(close*(1+r));
 const {up,lo}=limits({close});const hi=Math.min(up,r1(Math.max(ltp,close)*(1+Math.random()*.012)));const low=Math.max(lo,r1(Math.min(ltp,close)*(1-Math.random()*.012)));
 return {...s,close,ltp,high:hi,low,chg:(ltp-close)/close*100,hist:[...(s.hist||[]),ltp].slice(-60),hi52:Math.max(s.hi52||ltp,ltp),lo52:Math.min(s.lo52||ltp,ltp)};});}
const extra=p=>{const a=[p];for(let i=0;i<250;i++)a.unshift(r1(Math.max(1,a[0]/(1+gauss()*.015))));return {hist:a.slice(-30),hi52:Math.max(...a),lo52:Math.min(...a),pe:r1(6+Math.random()*22)};};
const seedMarket=()=>SEED.map(([symbol,name,cat,sector,p])=>({symbol,name,cat,sector,ltp:p,close:p,high:p,low:p,chg:0,...extra(p)}));
const META=Object.fromEntries(SEED.map(([symbol,name,cat,sector])=>[symbol,{name,sector}]));
const MON='JanFebMarAprMayJunJulAugSepOctNovDec';
function parseAsOf(a){const m=(a||'').match(/([A-Za-z]{3})[a-z]*\s+(\d{1,2}),\s*(\d{4})/);if(!m)return null;const i=MON.indexOf(m[1][0].toUpperCase()+m[1].slice(1).toLowerCase());if(i<0)return null;return `${m[3]}-${String(i/3+1).padStart(2,'0')}-${String(+m[2]).padStart(2,'0')}`;}
function tdBetween(a,b){const d=new Date(a+'T00:00:00Z'),e=new Date(b+'T00:00:00Z');let n=0;for(let i=0;i<400&&d<e;i++){d.setUTCDate(d.getUTCDate()+1);const w=d.getUTCDay();if(w!==5&&w!==6)n++;}return n;}
function mergeLive(old,stocks,newDay){const by=Object.fromEntries(old.map(m=>[m.symbol,m])),seen={};
 const mk=stocks.map(x=>{seen[x.symbol]=1;const o=by[x.symbol]||{},t=META[x.symbol]||{},pr=o.hist||[];
  const hist=(newDay||!pr.length?[...pr,x.ltp]:[...pr.slice(0,-1),x.ltp]).slice(-60);
  return {symbol:x.symbol,name:x.name||o.name||t.name||x.symbol,sector:x.sector||o.sector||t.sector||'Other',cat:x.category,ltp:x.ltp,close:x.ycp,high:x.high,low:x.low,chg:x.changePercent,pe:x.pe??o.pe??null,hist,hi52:Math.max(o.hi52??x.ltp,x.ltp),lo52:Math.min(o.lo52??x.ltp,x.ltp),live:true,vm:x.valueMn||0,vol:x.volume||0};});
 return mk.concat(old.filter(m=>!seen[m.symbol]));}
function freshLive(cap,d){const iso=parseAsOf(d.asOf)||new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Dhaka'});
 return {startCash:cap,cash:cap,realized:0,day:0,dayStartEq:cap,lots:[],txns:[],nw:[{day:0,eq:cap}],mode:'live',liveDate:iso,dates:{0:lab(iso)},liveAsOf:d.asOf,marketOpen:d.marketOpen,market:mergeLive([],d.stocks,false)};}
function applyLive(p,d){const iso=parseAsOf(d.asOf)||p.liveDate,nd=iso>p.liveDate;
 const eqOf=st=>st.cash+st.lots.reduce((a,l)=>a+l.qty*st.market.find(m=>m.symbol===l.symbol).ltp,0);
 let n={...p,market:mergeLive(p.market,d.stocks,nd),liveAsOf:d.asOf,marketOpen:d.marketOpen,stale:!!d.stale,behind:!!d.behind,expected:d.expectedDate};
 if(nd){const day=p.day+Math.max(1,tdBetween(p.liveDate,iso));n={...n,dayStartEq:eqOf(p),day,liveDate:iso,dates:{...p.dates,[day]:lab(iso)}};n.nw=[...(p.nw||[]),{day,eq:eqOf(n)}];}
 return n;}
const PAL=['#38bdf8','#34d399','#fbbf24','#f472b6','#a78bfa','#fb923c','#2dd4bf','#94a3b8'];
const CAT={A:'Regular dividend (10%+) and AGM held. Settles T+2.',B:'Dividend below 10%. Settles T+2.',N:'Newly listed. Settles T+2.',Z:'Missed dividend/AGM or running at a loss. Higher risk, settles T+3.'};
const fresh=(cap=500000)=>({startCash:cap,cash:cap,realized:0,day:0,dayStartEq:cap,lots:[],txns:[],nw:[{day:0,eq:cap}],market:tick(seedMarket())});
function load(){try{const u=localStorage.getItem('dse-user')||'default';const j=JSON.parse(localStorage.getItem(KEY+':'+u)||(u==='default'?localStorage.getItem(KEY):null));if(j&&j.market)return {...j,market:j.market.map(m=>m.hist?m:{...m,...extra(m.ltp)})};}catch(e){}return fresh();}
const Ic=({d,s=16})=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{d}</svg>;
const I={
 search:<><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></>,x:<><path d="M18 6 6 18"/><path d="m6 6 12 12"/></>,
 ff:<><polygon points="13 19 22 12 13 5 13 19"/><polygon points="2 19 11 12 2 5 2 19"/></>,
 up:<><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></>,
 down:<><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/></>,
 reset:<><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></>,
 sliders:<><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></>};

function Stat({label,value,sub,c}){return <div className="panel rounded-lg px-4 py-3 min-w-0"><div className="text-xs text-slate-400">{label}</div>
 <div className={`num text-lg sm:text-xl font-medium truncate ${c||''}`}>{value}</div>{sub&&<div className={`num text-xs ${c||'text-slate-500'}`}>{sub}</div>}</div>;}

function OrderModal({stock,side0,s,onClose,onSubmit}){
 const [side,setSide]=useState(side0);const [qty,setQty]=useState('');const [price,setPrice]=useState(String(stock.ltp));const [err,setErr]=useState('');const [note,setNote]=useState('');
 const {up,lo}=limits(stock);
 const mat=s.lots.filter(l=>l.symbol===stock.symbol&&s.day-l.day>=need(l.cat)).reduce((a,l)=>a+l.qty,0);
 const held=s.lots.filter(l=>l.symbol===stock.symbol).reduce((a,l)=>a+l.qty,0);
 const q=Math.floor(+qty)||0,p=+price||0,gross=q*p,fee=gross*FEE,total=side==='BUY'?gross+fee:gross-fee;
 return <div className="fixed inset-0 z-[55] flex items-end sm:items-center justify-center scrim p-3" onClick={onClose}>
 <div className="panel rounded-xl w-full max-w-md p-5" onClick={e=>e.stopPropagation()}>
  <div className="flex justify-between items-start mb-4"><div><div className="text-lg font-semibold">{stock.symbol} <span className="text-xs text-slate-400 font-normal">Cat {stock.cat}</span></div>
   <div className="text-xs text-slate-400">{stock.name}</div></div><button onClick={onClose} className="text-slate-400 hover:text-white"><Ic d={I.x} s={20}/></button></div>
  <div className="grid grid-cols-2 gap-1 p-1 rounded-lg bg-slate-900 mb-4">
   {['BUY','SELL'].map(t=><button key={t} onClick={()=>{setSide(t);setErr('')}} className={`py-2 rounded-md text-sm font-medium ${side===t?(t==='BUY'?'bg-emerald-600 text-white':'bg-rose-600 text-white'):'text-slate-400'}`}>{t==='BUY'?'Buy':'Sell'}</button>)}</div>
  <div className="grid grid-cols-3 gap-2 text-xs mb-4 num">
   <div><div className="text-slate-500 font-sans">LTP</div>{fmt(stock.ltp)}</div><div><div className="text-slate-500 font-sans">Circuit low</div>{fmt(lo)}</div><div><div className="text-slate-500 font-sans">Circuit high</div>{fmt(up)}</div></div>
  <label className="block text-xs text-slate-400 mb-1">Quantity</label>
  <input value={qty} onChange={e=>setQty(e.target.value)} type="number" min="1" inputMode="numeric" className="num w-full mb-3 bg-slate-900 border border-slate-700 rounded-md px-3 py-2 outline-none focus:border-emerald-500" placeholder="0"/>
  <label className="block text-xs text-slate-400 mb-1">Price per share (Tk)</label>
  <input value={price} onChange={e=>setPrice(e.target.value)} type="number" step="0.1" inputMode="decimal" className="num w-full mb-4 bg-slate-900 border border-slate-700 rounded-md px-3 py-2 outline-none focus:border-emerald-500"/>
  <label className="block text-xs text-slate-400 mb-1">Trade journal (why are you making this trade?)</label>
  <textarea value={note} onChange={e=>setNote(e.target.value)} rows="2" maxLength="300" className="w-full mb-4 bg-slate-900 border border-slate-700 rounded-md px-3 py-2 text-sm outline-none focus:border-emerald-500" placeholder="e.g. Strong Q3 earnings, buying the dip in a blue chip"/>
  <div className="text-sm space-y-1 mb-4 num">
   <div className="flex justify-between"><span className="text-slate-400 font-sans">Value</span><span>{tk(gross)}</span></div>
   <div className="flex justify-between"><span className="text-slate-400 font-sans">Commission (0.35%)</span><span>{tk(fee)}</span></div>
   <div className="flex justify-between font-medium border-t border-slate-700 pt-1"><span className="font-sans">{side==='BUY'?'Total cost':'Net proceeds'}</span><span>{tk(total)}</span></div>
   <div className="flex justify-between text-xs text-slate-500"><span className="font-sans">{side==='BUY'?'Cash available':'Sellable (matured) / held'}</span><span>{side==='BUY'?tk(s.cash):`${mat} / ${held}`}</span></div></div>
  {err&&<div className="mb-3 text-sm text-rose-300 bg-rose-950/60 border border-rose-900 rounded-md px-3 py-2">{err}</div>}
  <button onClick={()=>{const e=onSubmit(side,stock.symbol,qty,price,note);e?setErr(e):onClose()}} className={`w-full py-2.5 rounded-md font-medium text-white ${side==='BUY'?'bg-emerald-600 hover:bg-emerald-500':'bg-rose-600 hover:bg-rose-500'}`}>
   {side==='BUY'?'Place buy order':'Place sell order'}</button></div></div>;}

function Spark({data}){const W=600,H=150,P=8,n=data.length;
 if(n<2)return <div className="rmuted">Not enough trading days for a chart yet.</div>;
 const vs=data.map(d=>d.v);let mn=Math.min(...vs),mx=Math.max(...vs);if(mx===mn){mx+=1;mn-=1;}
 const X=i=>P+i*(W-2*P)/(n-1),Y=v=>H-P-(v-mn)/(mx-mn)*(H-2*P),pts=data.map((d,i)=>`${X(i)},${Y(d.v)}`).join(' ');
 return <div><svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:'auto'}}><polygon points={`${pts} ${X(n-1)},${H-P} ${X(0)},${H-P}`} fill="#0369a1" opacity=".12"/><polyline points={pts} fill="none" stroke="#0369a1" strokeWidth="2"/></svg>
  <div className="rmuted">{data[0].l}: Tk {fmt(vs[0])} to {data[n-1].l}: Tk {fmt(vs[n-1])}. Low {fmt(Math.min(...vs))}, high {fmt(Math.max(...vs))}.</div></div>;}
function Area({data}){
 const [h,setH]=useState(null);const W=600,H=190,P=10,n=data.length;
 if(n<2)return <div className="text-sm text-slate-500 py-12 text-center">Advance a trading day to start the chart.</div>;
 const vs=data.map(d=>d.v);let mn=Math.min(...vs),mx=Math.max(...vs);if(mx===mn){mx+=1;mn-=1;}const pd=(mx-mn)*.12;mn-=pd;mx+=pd;
 const X=i=>P+i*(W-2*P)/(n-1),Y=v=>H-P-(v-mn)/(mx-mn)*(H-2*P);const pts=data.map((d,i)=>`${X(i)},${Y(d.v)}`).join(' ');
 const c=vs[n-1]>=vs[0]?'#34d399':'#fb7185';const k=h==null?n-1:Math.min(h,n-1);
 return <div><div className="flex justify-between text-xs mb-1 num"><span className="text-slate-400">{data[k].l}</span><span>{tk(data[k].v)}</span></div>
 <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-auto cursor-crosshair" style={{touchAction:'pan-y'}} onPointerMove={e=>{const r=e.currentTarget.getBoundingClientRect();setH(Math.max(0,Math.round(((e.clientX-r.left)/r.width*W-P)/(W-2*P)*(n-1))));}} onPointerLeave={()=>setH(null)}>
  {[0,.5,1].map(f=><line key={f} x1={P} x2={W-P} y1={P+f*(H-2*P)} y2={P+f*(H-2*P)} stroke="#1e2a44"/>)}
  <polygon points={`${pts} ${X(n-1)},${H-P} ${X(0)},${H-P}`} fill={c} opacity=".14"/><polyline points={pts} fill="none" stroke={c} strokeWidth="2" strokeLinejoin="round"/>
  <line x1={X(k)} x2={X(k)} y1={P} y2={H-P} stroke="#64748b" strokeDasharray="3 3"/><circle cx={X(k)} cy={Y(data[k].v)} r="4" fill={c}/></svg>

    <h2>Net worth by trading day</h2><Spark data={nwData}/>
    <h2>Performance statistics</h2><table><tbody>{[['Total trades',`${s.txns.length} (${s.txns.length-sells.length} buys, ${sells.length} sells)`],['Closed trades in profit',sells.length?`${wins} of ${sells.length} (${fmt(wins/sells.length*100,0)}%)`:'n/a'],['Best day',bestD?`${bestD.l}: ${sg(bestD.p)} Tk (${sg(bestD.r)}%)`:'n/a'],['Worst day',worstD?`${worstD.l}: ${sg(worstD.p)} Tk (${sg(worstD.r)}%)`:'n/a'],['Maximum drawdown',`${fmt(mdd)}%`],['Largest sector exposure',sectors[0]?`${sectors[0].name}, ${fmt(sectors[0].pct,1)}% of holdings`:'n/a']].map(([a,b])=><tr key={a}><td style={{width:'30%'}}>{a}</td><td style={{textAlign:'left'}}>{b}</td></tr>)}</tbody></table>
    <h2>Open positions</h2><div className="rtbl"><table><thead><tr><th>Symbol</th><th>Sector</th><th>Qty</th><th>Avg cost</th><th>Price</th><th>Value</th><th>Unrealized P/L</th><th>Weight</th></tr></thead><tbody>
     {holds.map(h=>{const m=px[h.symbol],v=h.qty*m.ltp,u=v-h.cost;return <tr key={h.symbol}><td>{h.symbol}</td><td>{m.sector}</td><td>{h.qty}</td><td>{fmt(h.gross/h.qty)}</td><td>{fmt(m.ltp)}</td><td>{fmt(v)}</td><td className={rc(u)}>{sg(u)}</td><td>{fmt(v/equity*100,1)}%</td></tr>})}
     {!holds.length&&<tr><td colSpan="8" style={{textAlign:'center'}}>No open positions.</td></tr>}</tbody></table></div>
    <h2>Closed trades</h2><div className="rtbl"><table><thead><tr><th>Date</th><th>Symbol</th><th>Qty</th><th>Sell price</th><th>Fee</th><th>Realized P/L</th></tr></thead><tbody>
     {[...sells].reverse().map(t=><tr key={t.id}><td>{t.simDate}</td><td>{t.symbol}</td><td>{t.qty}</td><td>{fmt(t.price)}</td><td>{fmt(t.fee)}</td><td className={rc(t.pnl)}>{sg(t.pnl)}</td></tr>)}
     {!sells.length&&<tr><td colSpan="6" style={{textAlign:'center'}}>No closed trades.</td></tr>}</tbody></table></div>
    <h2>Transaction ledger</h2><div className="rtbl"><table><thead><tr><th>ID</th><th>Date</th><th>Type</th><th>Symbol</th><th>Qty</th><th>Price</th><th>Fee</th><th>Net amount</th><th>Journal note</th></tr></thead><tbody>
     {[...s.txns].reverse().map(t=><tr key={t.id}><td>{t.id}</td><td>{t.simDate}</td><td>{t.type}</td><td>{t.symbol}</td><td>{t.qty}</td><td>{fmt(t.price)}</td><td>{fmt(t.fee)}</td><td>{fmt(t.total)}</td><td style={{textAlign:'left',whiteSpace:'normal',minWidth:180}}>{t.note||''}</td></tr>)}
     {!s.txns.length&&<tr><td colSpan="9" style={{textAlign:'center'}}>No transactions.</td></tr>}</tbody></table></div>
    {prof.notes&&<><h2>Strategy and reflection</h2><p style={{whiteSpace:'pre-wrap',margin:0}}>{prof.notes}</p></>}
    <p className="rmuted" style={{marginTop:18}}>Simulated trading with fictional capital. Commission 0.35% per trade; settlement T+2 (A/B/N) and T+3 (Z); circuit limits &plusmn;10% of the previous close. {isLive?`Prices from the DSE website, last updated ${s.liveAsOf||'n/a'}.`:'Prices in this report are simulated, not real DSE prices.'}</p>
   </div></div></div>}
  {tab==='market'&&<>
   <div className="flex flex-wrap gap-2 mb-3"><div className="relative flex-1 min-w-[180px]"><span className="absolute left-3 top-2.5 text-slate-500"><Ic d={I.search}/></span>
    <input id="q" value={q} onChange={e=>setQ(e.target.value)} placeholder="Search symbol or company  ( / )" className="w-full panel rounded-md pl-9 pr-3 py-2 text-sm outline-none focus:border-sky-500"/></div>
    <div className="flex gap-1">{['All','A','B','Z','★'].map(c=><button key={c} onClick={()=>setCat(c)} className={`px-3 py-2 rounded-md text-sm ${cat===c?'bg-sky-600 text-white':'panel text-slate-300'}`}>{c}</button>)}</div></div>
   <div className="panel rounded-lg overflow-x-auto"><table className="w-full num"><thead><tr>{[['symbol','Symbol'],['cat','Cat'],['sector','Sector'],['ltp','LTP'],['high','High'],['low','Low'],['close','YCP'],['chg','Change']].map(([k,l])=><th key={k} onClick={()=>setSort(o=>({k,d:o.k===k?-o.d:1}))} className="cursor-pointer select-none">{l}{sort.k===k?(sort.d>0?' ▲':' ▼'):''}</th>)}<th></th></tr></thead><tbody>
    {shown.slice(0,400).map(m=><tr key={m.symbol}><td className="font-sans"><button onClick={()=>toggleWatch(m.symbol)} className="mr-1 text-amber-300">{(s.watch||[]).includes(m.symbol)?'★':'☆'}</button><button onClick={()=>setDrawer(m.symbol)} className="font-medium text-sky-300 hover:underline">{m.symbol}</button><div className="text-xs text-slate-500">{m.name}</div></td><td className="font-sans">{m.cat}</td>
     <td className="font-sans text-slate-400">{m.sector}</td><td className={cls(m.chg)}>{fmt(m.ltp)}</td><td>{fmt(m.high)}</td><td>{fmt(m.low)}</td><td className="text-slate-400">{fmt(m.close)}</td>
     <td className={cls(m.chg)}><span className="inline-flex items-center gap-1">{m.chg!==0&&<Ic s={13} d={m.chg>0?I.up:I.down}/>}{sg(m.chg)}%</span></td>
     <td className="font-sans"><button onClick={()=>setOrder({m,side:'BUY'})} className="bg-emerald-600/90 hover:bg-emerald-500 text-white rounded px-3 py-1 text-xs mr-1">Buy</button>
      <button onClick={()=>setOrder({m,side:'SELL'})} className="bg-rose-600/90 hover:bg-rose-500 text-white rounded px-3 py-1 text-xs">Sell</button></td></tr>)}
    {!rows.length&&<tr><td colSpan="9" className="!text-center text-slate-500 py-8 font-sans">No stocks match. Try another search or category.</td></tr>}</tbody></table></div></>}
  {tab==='portfolio'&&<div className="panel rounded-lg overflow-x-auto"><table className="w-full num"><thead><tr><th>Symbol</th><th>Cat</th><th>Qty</th><th>Avg buy</th><th>LTP</th><th>Value</th><th>Unrealized P/L</th><th>Bought</th><th>Status</th><th></th></tr></thead><tbody>
   {holds.map(h=>{const m=px[h.symbol],v=h.qty*m.ltp,u=v-h.cost;return <tr key={h.symbol}><td className="font-sans font-medium"><button onClick={()=>setDrawer(h.symbol)} className="text-sky-300 hover:underline">{h.symbol}</button></td><td className="font-sans">{h.cat}</td><td>{h.qty}</td>
    <td>{fmt(h.gross/h.qty)}</td><td>{fmt(m.ltp)}</td><td>{fmt(v)}</td><td className={cls(u)}>{sg(u)} <span className="text-xs">({sg(u/h.cost*100)}%)</span></td><td className="font-sans text-slate-400">{h.date}</td>
    <td className="font-sans">{h.mat===h.qty?<span className="text-emerald-400">Matured</span>:<span className="text-amber-400">{h.mat?`${h.mat} matured, `:''}T+{need(h.cat)} in {h.next}d</span>}</td>
    <td className="font-sans"><button onClick={()=>setOrder({m,side:'SELL'})} className="bg-rose-600/90 hover:bg-rose-500 text-white rounded px-3 py-1 text-xs">Sell</button></td></tr>})}
   {!holds.length&&<tr><td colSpan="10" className="!text-center text-slate-500 py-8 font-sans">No holdings yet. Pick a stock in Market and place your first buy order.</td></tr>}</tbody></table></div>}
  {tab==='ledger'&&<div className="panel rounded-lg overflow-x-auto"><table className="w-full num"><thead><tr><th>ID</th><th>Trade day</th><th>Type</th><th>Symbol</th><th>Qty</th><th>Price</th><th>Fee</th><th>Total</th><th>Realized P/L</th><th>Journal note</th></tr></thead><tbody>
   {s.txns.map(t=><tr key={t.id}><td className="font-sans text-slate-400">{t.id}<div className="text-[11px] text-slate-600">{new Date(t.ts).toLocaleString()}</div></td><td className="font-sans">{t.simDate}</td>
    <td className={`font-sans ${t.type==='BUY'?'text-emerald-400':'text-rose-400'}`}>{t.type}</td><td className="font-sans">{t.symbol}</td><td>{t.qty}</td><td>{fmt(t.price)}</td><td>{fmt(t.fee)}</td><td>{fmt(t.total)}</td>
    <td className={t.pnl==null?'text-slate-600':cls(t.pnl)}>{t.pnl==null?'–':sg(t.pnl)}</td><td className="font-sans text-slate-400 !text-left max-w-[260px] truncate" title={t.note}>{t.note||'–'}</td></tr>)}
   {!s.txns.length&&<tr><td colSpan="10" className="!text-center text-slate-500 py-8 font-sans">No transactions yet.</td></tr>}</tbody></table></div>}
  <p className="text-xs text-slate-600 mt-4">{isLive?'Live DSE prices via your API.':'Prices are simulated.'} Commission 0.35% on each trade. Settlement: T+2 for A/B/N, T+3 for Z. Circuit limits are &plusmn;10% of the previous close.</p>
  {order&&<OrderModal stock={px[order.m.symbol]} side0={order.side} s={s} onClose={()=>setOrder(null)} onSubmit={trade}/>}
  {drawer&&<Drawer stock={px[drawer]} onClose={()=>setDrawer(null)} onTrade={side=>setOrder({m:px[drawer],side})} held={holds.find(h=>h.symbol===drawer)}/>}
  {csvView&&<div className="fixed inset-0 z-50 flex items-center justify-center scrim p-3" onClick={()=>setCsvView('')}><div className="panel rounded-xl w-full max-w-2xl p-4" onClick={e=>e.stopPropagation()}>
   <div className="text-sm mb-2">Direct download isn't available here. Copy this text and save it as a file (.csv for transactions, .html for the report).</div><textarea readOnly value={csvView} onFocus={e=>e.target.select()} className="num w-full h-64 bg-slate-900 border border-slate-700 rounded-md p-2 text-xs"/>
   <button onClick={()=>setCsvView('')} className="mt-2 panel rounded-md px-4 py-2 text-sm">Close</button></div></div>}
  {cfg&&<div className="fixed inset-0 z-50 flex items-center justify-center scrim p-3" onClick={()=>setCfg(false)}><div className="panel rounded-xl w-full max-w-sm p-5" onClick={e=>e.stopPropagation()}>
   <div className="font-semibold mb-1">Reset simulation</div><p className="text-sm text-slate-400 mb-3">This clears all holdings and transactions and starts again from day 1 with your chosen starting capital.</p>
   <label className="text-xs text-slate-400">Starting capital (Tk)</label>
   <input value={cap} onChange={e=>setCap(e.target.value)} type="number" className="num w-full mt-1 mb-4 bg-slate-900 border border-slate-700 rounded-md px-3 py-2 outline-none focus:border-sky-500"/>
   {api&&<label className="flex items-center gap-2 text-sm text-slate-300 mb-4"><input type="checkbox" checked={useLive} onChange={e=>setUseLive(e.target.checked)}/>Use live DSE prices (real trading days)</label>}
   <div className="flex gap-2"><button onClick={()=>setCfg(false)} className="flex-1 panel rounded-md py-2 text-sm">Cancel</button>
    <button onClick={()=>{const c=+cap;if(c>0){setS(useLive&&api?freshLive(c,api):fresh(c));setCfg(false);say(useLive&&api?'Live portfolio started':'Simulation reset')}}} className="flex-1 bg-rose-600 hover:bg-rose-500 rounded-md py-2 text-sm font-medium">Reset and start</button></div></div></div>}
  {toast&&<div className="fixed bottom-5 left-1/2 -translate-x-1/2 z-[60] bg-slate-100 text-slate-900 text-sm rounded-md px-4 py-2 shadow-lg">{toast}</div>}
 </div>;}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
